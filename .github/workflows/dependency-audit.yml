name: Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Install
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --audit-level moderate --omit dev
        continue-on-error: true

      - name: Audit all dependencies
        id: audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Create issue on failure
        if: steps.audit.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['security', 'dependencies']
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Dependency audit found vulnerabilities',
                body: 'The scheduled `npm audit` identified vulnerabilities. Run `npm run audit` locally to investigate and update affected packages.',
                labels: ['security', 'dependencies']
              });
            }
